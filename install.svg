<defs><clipPath id="win"><rect x="1" y="1" width="1198" height="438" rx="18"/></clipPath></defs>
<rect x="1" y="1" width="1198" height="438" rx="18" fill="#0d0d0d"/>
<g clip-path="url(#win)"><rect x="0" y="0" width="1200" height="48" fill="#161616"/><line x1="0" y1="48.5" x2="1200" y2="48.5" stroke="#262626"/></g>
<circle cx="30" cy="24" r="7" fill="#ff5f57"/><circle cx="54" cy="24" r="7" fill="#febc2e"/><circle cx="78" cy="24" r="7" fill="#28c840"/>
<text class="mono" x="600.0" y="29" font-size="14" fill="#a1a1aa" text-anchor="middle">you@your-box: ~ — bash</text>
<g clip-path="url(#win)">
<g class="l0">
  <text class="mono" x="44" y="100" font-size="18" textLength="162.0" lengthAdjust="spacing"><tspan fill="#10b981" font-weight="700">you</tspan><tspan fill="#a1a1aa">@</tspan><tspan fill="#65a5ff">your-box</tspan><tspan fill="#a1a1aa">:</tspan><tspan fill="#8b5cf6">~</tspan><tspan fill="#a1a1aa">$</tspan></text>
  <text class="mono" x="216.8" y="100" font-size="18" fill="#fafafa" textLength="658.8" lengthAdjust="spacing">git clone https://github.com/JustDashboard/Just-Dashboard.git</text>
  <g class="c0"><rect class="cover" x="216.8" y="78" width="672.8" height="28" fill="#0d0d0d"/><g class="k0 cur"><rect class="blink" x="216.8" y="83" width="10.8" height="22" fill="#cae9ff" fill-opacity=".85"/></g></g>
</g>
<g class="l1">
  <text class="mono" x="44" y="130" font-size="18" textLength="162.0" lengthAdjust="spacing"><tspan fill="#10b981" font-weight="700">you</tspan><tspan fill="#a1a1aa">@</tspan><tspan fill="#65a5ff">your-box</tspan><tspan fill="#a1a1aa">:</tspan><tspan fill="#8b5cf6">~</tspan><tspan fill="#a1a1aa">$</tspan></text>
  <text class="mono" x="216.8" y="130" font-size="18" fill="#fafafa" textLength="410.4" lengthAdjust="spacing">cd Just-Dashboard &amp;&amp; sudo ./install.sh</text>
  <g class="c1"><rect class="cover" x="216.8" y="108" width="424.4" height="28" fill="#0d0d0d"/><g class="k1 cur"><rect class="blink" x="216.8" y="113" width="10.8" height="22" fill="#cae9ff" fill-opacity=".85"/></g></g>
</g>
<g class="o2"><text class="mono" x="44" y="160" font-size="18" xml:space="preserve" textLength="237.6" lengthAdjust="spacing"><tspan fill="#65a5ff" font-weight="700">[1/4] Prepare the host</tspan></text></g>
<g class="o3"><text class="mono" x="44" y="190" font-size="18" xml:space="preserve" textLength="594.0" lengthAdjust="spacing"><tspan fill="#10b981">  [ok]</tspan><tspan fill="#a1a1aa"> git, git-lfs, gh, whois and traceroute are ready</tspan></text></g>
<g class="o4"><text class="mono" x="44" y="220" font-size="18" xml:space="preserve" textLength="313.2" lengthAdjust="spacing"><tspan fill="#65a5ff" font-weight="700">[2/4] Configure the dashboard</tspan></text></g>
<g class="o5"><text class="mono" x="44" y="250" font-size="18" xml:space="preserve" textLength="226.8" lengthAdjust="spacing"><tspan fill="#65a5ff" font-weight="700">[3/4] Build and start</tspan></text></g>
<g class="o6"><text class="mono" x="44" y="280" font-size="18" xml:space="preserve" textLength="216.0" lengthAdjust="spacing"><tspan fill="#65a5ff" font-weight="700">[4/4] Verify startup</tspan></text></g>
<g class="o7"><text class="mono" x="44" y="310" font-size="18" xml:space="preserve" textLength="270.0" lengthAdjust="spacing"><tspan fill="#10b981">  [ok]</tspan><tspan fill="#a1a1aa"> backend is healthy</tspan></text></g>
<g class="o8"><text class="mono" x="44" y="340" font-size="18" xml:space="preserve" textLength="442.8" lengthAdjust="spacing"><tspan fill="#10b981" font-weight="700">Setup complete · the dashboard is running</tspan></text></g>
<g class="o9"><text class="mono" x="44" y="370" font-size="18" xml:space="preserve" textLength="464.4" lengthAdjust="spacing"><tspan fill="#65a5ff">  https://your-box.tailnet-name.ts.net:8443</tspan></text></g>
<g class="l10">
  <text class="mono" x="44" y="400" font-size="18" textLength="162.0" lengthAdjust="spacing"><tspan fill="#10b981" font-weight="700">you</tspan><tspan fill="#a1a1aa">@</tspan><tspan fill="#65a5ff">your-box</tspan><tspan fill="#a1a1aa">:</tspan><tspan fill="#8b5cf6">~</tspan><tspan fill="#a1a1aa">$</tspan></text>
  <rect class="blink" x="216.8" y="383" width="10.8" height="22" fill="#cae9ff" fill-opacity=".85"/>
</g>
