<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Install Just Dashboard</title>
<desc id="desc">Terminal: git clone https://github.com/JustDashboard/Just-Dashboard.git, then cd Just-Dashboard and sudo ./install.sh. The installer runs four stages (prepare the host, configure the dashboard, build and start, verify startup) and prints the dashboard address on your tailnet.</desc>
<style>

.mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
.blink { animation: blink 1s step-end infinite; }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

@keyframes l0 { 0% { opacity: 0; animation-timing-function: step-end; } 2.500% { opacity: 1; } 95.000% { opacity: 1; } 97.500% { opacity: 0; } 100% { opacity: 0; } }
@keyframes c0 { 0% { transform: translateX(0px); } 4.250% { transform: translateX(0px); animation-timing-function: steps(61, end); } 16.250% { transform: translateX(658.8px); } 98.000% { transform: translateX(658.8px); animation-timing-function: step-end; } 100% { transform: translateX(0px); } }
@keyframes k0 { 0% { opacity: 0; animation-timing-function: step-end; } 2.500% { opacity: 1; animation-timing-function: step-end; } 17.750% { opacity: 0; animation-timing-function: step-end; } 100% { opacity: 0; } }
.l0 { animation: l0 20.0s linear infinite; } .c0 { animation: c0 20.0s linear infinite; } .k0 { animation: k0 20.0s infinite; }
@keyframes l1 { 0% { opacity: 0; animation-timing-function: step-end; } 18.500% { opacity: 1; } 95.000% { opacity: 1; } 97.500% { opacity: 0; } 100% { opacity: 0; } }
@keyframes c1 { 0% { transform: translateX(0px); } 20.250% { transform: translateX(0px); animation-timing-function: steps(38, end); } 32.250% { transform: translateX(410.4px); } 98.000% { transform: translateX(410.4px); animation-timing-function: step-end; } 100% { transform: translateX(0px); } }
@keyframes k1 { 0% { opacity: 0; animation-timing-function: step-end; } 18.500% { opacity: 1; animation-timing-function: step-end; } 33.750% { opacity: 0; animation-timing-function: step-end; } 100% { opacity: 0; } }
.l1 { animation: l1 20.0s linear infinite; } .c1 { animation: c1 20.0s linear infinite; } .k1 { animation: k1 20.0s infinite; }
@keyframes o2 { 0% { opacity: 0; } 37.000% { opacity: 0; } 38.000% { opacity: 1; } 95.000% { opacity: 1; } 97.500% { opacity: 0; } 100% { opacity: 0; } }
.o2 { animation: o2 20.0s linear infinite; }
@keyframes o3 { 0% { opacity: 0; } 41.500% { opacity: 0; } 42.500% { opacity: 1; } 95.000% { opacity: 1; } 97.500% { opacity: 0; } 100% { opacity: 0; } }
.o3 { animation: o3 20.0s linear infinite; }
@keyframes o4 { 0% { opacity: 0; } 44.500% { opacity: 0; } 45.500% { opacity: 1; } 95.000% { opacity: 1; } 97.500% { opacity: 0; } 100% { opacity: 0; } }
.o4 { animation: o4 20.0s linear infinite; }
@keyframes o5 { 0% { opacity: 0; } 49.000% { opacity: 0; } 50.000% { opacity: 1; } 95.000% { opacity: 1; } 97.500% { opacity: 0; } 100% { opacity: 0; } }
.o5 { animation: o5 20.0s linear infinite; }
@keyframes o6 { 0% { opacity: 0; } 55.500% { opacity: 0; } 56.500% { opacity: 1; } 95.000% { opacity: 1; } 97.500% { opacity: 0; } 100% { opacity: 0; } }
.o6 { animation: o6 20.0s linear infinite; }
@keyframes o7 { 0% { opacity: 0; } 59.500% { opacity: 0; } 60.500% { opacity: 1; } 95.000% { opacity: 1; } 97.500% { opacity: 0; } 100% { opacity: 0; } }
.o7 { animation: o7 20.0s linear infinite; }
@keyframes o8 { 0% { opacity: 0; } 62.500% { opacity: 0; } 63.500% { opacity: 1; } 95.000% { opacity: 1; } 97.500% { opacity: 0; } 100% { opacity: 0; } }
.o8 { animation: o8 20.0s linear infinite; }
@keyframes o9 { 0% { opacity: 0; } 64.500% { opacity: 0; } 65.500% { opacity: 1; } 95.000% { opacity: 1; } 97.500% { opacity: 0; } 100% { opacity: 0; } }
.o9 { animation: o9 20.0s linear infinite; }
@keyframes l10 { 0% { opacity: 0; animation-timing-function: step-end; } 67.000% { opacity: 1; } 95.000% { opacity: 1; } 97.500% { opacity: 0; } 100% { opacity: 0; } }
.l10 { animation: l10 20.0s linear infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .cover, .cur { display: none; } }
